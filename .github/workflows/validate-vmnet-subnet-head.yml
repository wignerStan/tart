name: Validate corrected vmnet subnet head

on:
  push:
    branches:
      - ci/vmnet-subnet-v3

permissions:
  contents: read

jobs:
  validate:
    name: Xcode 27 build, tests, and test bundle
    runs-on: xcode-27-arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Verify toolchain and source revision
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          git rev-parse HEAD
          test "$(git rev-parse HEAD^)" = "43978042b895d0dd8dcb1a2243c9c2187cb1af36"

      - name: Verify vmnet SDK contract and development entitlement
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          VMNET="$SDK/System/Library/Frameworks/vmnet.framework/Headers/vmnet.h"
          test -f "$VMNET"
          grep -n -B 5 -A 24 'vmnet_network_configuration_set_ipv4_subnet' "$VMNET"
          grep -q 'The subnet address' "$VMNET"
          plutil -lint Resources/tart-vmnet-dev.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.vm.networking' Resources/tart-vmnet-dev.entitlements)" = true

      - name: Probe the subnet setter with a canonical network address
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/vmnet-setter-probe.c" <<'C'
          #include <arpa/inet.h>
          #include <CoreFoundation/CoreFoundation.h>
          #include <stdio.h>
          #include <vmnet/vmnet.h>

          int main(void) {
            vmnet_return_t status = VMNET_FAILURE;
            vmnet_network_configuration_ref configuration =
                vmnet_network_configuration_create(VMNET_SHARED_MODE, &status);
            if (configuration == NULL || status != VMNET_SUCCESS) {
              fprintf(stderr, "configuration creation failed: %d\n", status);
              return 1;
            }

            struct in_addr subnet = {0};
            struct in_addr mask = {0};
            if (inet_pton(AF_INET, "192.168.247.0", &subnet) != 1 ||
                inet_pton(AF_INET, "255.255.255.0", &mask) != 1) {
              CFRelease(configuration);
              return 2;
            }

            status = vmnet_network_configuration_set_ipv4_subnet(
                configuration, &subnet, &mask);
            CFRelease(configuration);

            if (status != VMNET_SUCCESS) {
              fprintf(stderr, "subnet setter failed: %d\n", status);
              return 3;
            }

            puts("canonical subnet address accepted");
            return 0;
          }
          C
          xcrun clang "$RUNNER_TEMP/vmnet-setter-probe.c" \
            -framework CoreFoundation \
            -framework vmnet \
            -o "$RUNNER_TEMP/vmnet-setter-probe"
          "$RUNNER_TEMP/vmnet-setter-probe"

      - name: Build
        run: swift build --build-system swiftbuild

      - name: Run full unit suite
        shell: bash
        run: |
          export PATH="$PATH:/usr/sbin"
          swift test --build-system swiftbuild

      - name: Run vmnet tests explicitly
        run: swift test --build-system swiftbuild --filter NetworkVmnetTests

      - name: Check SwiftFormat
        shell: bash
        run: |
          swift package plugin --allow-writing-to-package-directory swiftformat --cache ignore .
          git diff --check
          git diff --exit-code

      - name: Build Apple Silicon test bundle
        shell: bash
        run: |
          set -euxo pipefail
          swift build -c release --product tart --build-system swiftbuild
          BIN_DIR="$(swift build -c release --build-system swiftbuild --show-bin-path)"
          "$BIN_DIR/tart" --version
          "$BIN_DIR/tart" run --help | grep -q -- '--net-vmnet-subnet'

          ROOT="$RUNNER_TEMP/tart-vmnet-subnet"
          APP="$ROOT/tart.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_DIR/tart" "$APP/Contents/MacOS/tart"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/embedded.provisionprofile "$APP/Contents/embedded.provisionprofile"
          cp "Resources/actool/UPW Tart.icns" "Resources/actool/Assets.car" "$APP/Contents/Resources/"

          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements Resources/tart-vmnet-dev.entitlements \
            "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          plutil -lint "$RUNNER_TEMP/entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.vm.networking' "$RUNNER_TEMP/entitlements.plist")" = true

          printf '%s\n' "43978042b895d0dd8dcb1a2243c9c2187cb1af36" > "$ROOT/FEATURE_PARENT.txt"
          git rev-parse HEAD > "$ROOT/BUILD_COMMIT.txt"
          cp Resources/tart-vmnet-dev.entitlements "$ROOT/"
          cat > "$ROOT/TESTING.md" <<'EOF'
          # Real-machine vmnet subnet smoke test

          Requirements: Apple Silicon, macOS 26 or newer, and a locally available Tart VM.

          The app is ad-hoc signed for transport. On the test Mac, remove quarantine and re-sign it with the included entitlement before running:

          ```sh
          xattr -dr com.apple.quarantine tart.app
          codesign --force --deep --sign - \
            --entitlements tart-vmnet-dev.entitlements \
            tart.app
          codesign --verify --strict --verbose=2 tart.app
          codesign --display --entitlements - tart.app 2>&1
          ```

          Run a VM on a non-overlapping private subnet:

          ```sh
          ./tart.app/Contents/MacOS/tart run \
            --net-vmnet-subnet 192.168.200.0/24 \
            YOUR_VM
          ```

          From another terminal, verify the guest address and route:

          ```sh
          TART=./tart.app/Contents/MacOS/tart
          IP="$($TART ip YOUR_VM --wait 120)"
          printf 'guest IP: %s\n' "$IP"
          route -n get "$IP"
          ping -c 3 "$IP"
          ```

          Verify in the guest that DHCP supplied an address in 192.168.200.0/24, DNS works, and Internet access works. Then verify the sing-box route rule for that CIDR selects the direct outbound while the Parallels CIDR remains handled by its existing rule.
          EOF

          cd "$RUNNER_TEMP"
          ditto -c -k --keepParent tart-vmnet-subnet tart-vmnet-subnet-arm64.zip
          shasum -a 256 tart-vmnet-subnet-arm64.zip > tart-vmnet-subnet-arm64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: tart-vmnet-subnet-arm64-43978042
          path: |
            ${{ runner.temp }}/tart-vmnet-subnet-arm64.zip
            ${{ runner.temp }}/tart-vmnet-subnet-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
