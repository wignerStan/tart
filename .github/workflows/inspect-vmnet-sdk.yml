name: Inspect vmnet SDK ownership

on:
  push:
    branches:
      - review/vmnet-sdk-ownership
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Inspect SDK declarations
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          VMNET="$SDK/System/Library/Frameworks/vmnet.framework/Headers/vmnet.h"
          VZ="$SDK/System/Library/Frameworks/Virtualization.framework/Headers/VZVmnetNetworkDeviceAttachment.h"

          sw_vers
          swift --version
          xcodebuild -version
          test -f "$VMNET"
          test -f "$VZ"

          grep -n -B 12 -A 20 'vmnet_network_configuration_create' "$VMNET"
          grep -n -B 12 -A 20 'vmnet_network_create' "$VMNET"
          grep -n -B 20 -A 35 'vmnet_network_configuration_set_ipv4_subnet' "$VMNET"
          grep -n -B 12 -A 30 'dhcp_reservation' "$VMNET" || true
          grep -n -B 8 -A 12 'vmnet_network_configuration_ref' "$VMNET" | head -80
          grep -n -B 8 -A 12 'vmnet_network_ref' "$VMNET" | head -120
          cat "$VZ"

      - name: Probe IPv4 subnet setter without reserving a network
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/probe.c" <<'C'
          #include <arpa/inet.h>
          #include <CoreFoundation/CoreFoundation.h>
          #include <stdio.h>
          #include <vmnet/vmnet.h>

          static void probe(const char *address, const char *mask) {
            vmnet_return_t status = VMNET_FAILURE;
            vmnet_network_configuration_ref configuration =
                vmnet_network_configuration_create(VMNET_SHARED_MODE, &status);
            if (configuration == NULL) {
              printf("create %s/%s -> null, status=%d\n", address, mask, status);
              return;
            }

            struct in_addr subnet_address = {0};
            struct in_addr subnet_mask = {0};
            inet_pton(AF_INET, address, &subnet_address);
            inet_pton(AF_INET, mask, &subnet_mask);

            vmnet_return_t subnet_status =
                vmnet_network_configuration_set_ipv4_subnet(
                    configuration,
                    &subnet_address,
                    &subnet_mask);
            printf("set %s mask %s -> status=%d\n", address, mask, subnet_status);
            CFRelease(configuration);
          }

          int main(void) {
            probe("192.168.200.0", "255.255.255.0");
            probe("192.168.200.1", "255.255.255.0");
            probe("192.168.200.2", "255.255.255.0");
            probe("192.168.200.0", "255.255.255.252");
            probe("192.168.200.1", "255.255.255.252");
            probe("192.168.200.0", "255.255.255.254");
            probe("192.168.200.1", "255.255.255.254");
            probe("10.0.0.1", "255.0.0.0");
            probe("172.16.0.1", "255.240.0.0");
            probe("192.168.0.1", "255.255.0.0");
            probe("203.0.113.1", "255.255.255.0");
            return 0;
          }
          C

          xcrun clang \
            "$RUNNER_TEMP/probe.c" \
            -framework CoreFoundation \
            -framework vmnet \
            -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"

      - name: Type-check opaque-pointer release pattern
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/ownership.swift" <<'SWIFT'
          import vmnet

          private enum TestError: Error {
            case configuration(vmnet_return_t)
            case network(vmnet_return_t)
          }

          @available(macOS 26, *)
          final class Owner {
            private let network: vmnet_network_ref

            init() throws {
              var status: vmnet_return_t = .VMNET_FAILURE
              guard let configuration = vmnet_network_configuration_create(.VMNET_SHARED_MODE, &status) else {
                throw TestError.configuration(status)
              }
              defer { Self.release(configuration) }

              guard status == .VMNET_SUCCESS else {
                throw TestError.configuration(status)
              }

              status = .VMNET_FAILURE
              guard let network = vmnet_network_create(configuration, &status) else {
                throw TestError.network(status)
              }

              guard status == .VMNET_SUCCESS else {
                Self.release(network)
                throw TestError.network(status)
              }

              self.network = network
            }

            deinit {
              Self.release(network)
            }

            private static func release(_ pointer: OpaquePointer) {
              Unmanaged<AnyObject>.fromOpaque(UnsafeRawPointer(pointer)).release()
            }
          }
          SWIFT

          xcrun swiftc -typecheck "$RUNNER_TEMP/ownership.swift"

      - name: Compare release helper code generation
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$RUNNER_TEMP/unmanaged.swift" <<'SWIFT'
          @inline(never)
          public func releaseWithUnmanaged(_ pointer: OpaquePointer) {
            Unmanaged<AnyObject>.fromOpaque(UnsafeRawPointer(pointer)).release()
          }
          SWIFT

          cat > "$RUNNER_TEMP/raw-cf.swift" <<'SWIFT'
          @_silgen_name("CFRelease")
          private func rawCFRelease(_ object: UnsafeRawPointer)

          @inline(never)
          public func releaseWithRawCFRelease(_ pointer: OpaquePointer) {
            rawCFRelease(UnsafeRawPointer(pointer))
          }
          SWIFT

          for source in unmanaged raw-cf; do
            xcrun swiftc \
              -parse-as-library \
              -O \
              -emit-object \
              "$RUNNER_TEMP/$source.swift" \
              -o "$RUNNER_TEMP/$source.o"
            echo "=== undefined symbols: $source ==="
            nm -u "$RUNNER_TEMP/$source.o"
            echo "=== disassembly: $source ==="
            otool -tvV "$RUNNER_TEMP/$source.o"
          done
