name: Inspect vmnet SDK ownership

on:
  push:
    branches:
      - review/vmnet-sdk-ownership
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Inspect SDK declarations
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          VMNET="$SDK/System/Library/Frameworks/vmnet.framework/Headers/vmnet.h"
          VZ="$SDK/System/Library/Frameworks/Virtualization.framework/Headers/VZVmnetNetworkDeviceAttachment.h"

          sw_vers
          swift --version
          xcodebuild -version
          test -f "$VMNET"
          test -f "$VZ"

          grep -n -B 12 -A 20 'vmnet_network_configuration_create' "$VMNET"
          grep -n -B 12 -A 20 'vmnet_network_create' "$VMNET"
          grep -n -B 8 -A 12 'vmnet_network_configuration_ref' "$VMNET" | head -80
          grep -n -B 8 -A 12 'vmnet_network_ref' "$VMNET" | head -120
          cat "$VZ"

      - name: Type-check opaque-pointer release pattern
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/ownership.swift" <<'SWIFT'
          import vmnet

          private enum TestError: Error {
            case configuration(vmnet_return_t)
            case network(vmnet_return_t)
          }

          @available(macOS 26, *)
          final class Owner {
            private let network: vmnet_network_ref

            init() throws {
              var status: vmnet_return_t = .VMNET_FAILURE
              guard let configuration = vmnet_network_configuration_create(.VMNET_SHARED_MODE, &status) else {
                throw TestError.configuration(status)
              }
              defer { Self.release(configuration) }

              guard status == .VMNET_SUCCESS else {
                throw TestError.configuration(status)
              }

              status = .VMNET_FAILURE
              guard let network = vmnet_network_create(configuration, &status) else {
                throw TestError.network(status)
              }

              guard status == .VMNET_SUCCESS else {
                Self.release(network)
                throw TestError.network(status)
              }

              self.network = network
            }

            deinit {
              Self.release(network)
            }

            private static func release(_ pointer: OpaquePointer) {
              Unmanaged<AnyObject>.fromOpaque(UnsafeRawPointer(pointer)).release()
            }
          }
          SWIFT

          xcrun swiftc -typecheck "$RUNNER_TEMP/ownership.swift"
