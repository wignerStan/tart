name: Probe vmnet network creation

on:
  push:
    branches:
      - probe/vmnet-network-create

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Create and inspect a logical vmnet network
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          cat > "$RUNNER_TEMP/probe.c" <<'C'
          #include <arpa/inet.h>
          #include <CoreFoundation/CoreFoundation.h>
          #include <stdio.h>
          #include <vmnet/vmnet.h>

          static void print_addr(const char *label, struct in_addr address) {
            char buffer[INET_ADDRSTRLEN];
            if (inet_ntop(AF_INET, &address, buffer, sizeof(buffer)) == NULL) {
              perror("inet_ntop");
              return;
            }
            printf("%s%s\n", label, buffer);
          }

          int main(void) {
            vmnet_return_t status = VMNET_FAILURE;
            vmnet_network_configuration_ref config =
              vmnet_network_configuration_create(VMNET_SHARED_MODE, &status);
            if (config == NULL || status != VMNET_SUCCESS) {
              fprintf(stderr, "configuration creation failed: %d\n", status);
              return 1;
            }

            struct in_addr requested = {0};
            struct in_addr requested_mask = {0};
            inet_pton(AF_INET, "192.168.247.0", &requested);
            inet_pton(AF_INET, "255.255.255.0", &requested_mask);

            status = vmnet_network_configuration_set_ipv4_subnet(
              config, &requested, &requested_mask);
            if (status != VMNET_SUCCESS) {
              fprintf(stderr, "subnet setter failed: %d\n", status);
              CFRelease(config);
              return 2;
            }

            status = VMNET_FAILURE;
            vmnet_network_ref network = vmnet_network_create(config, &status);
            CFRelease(config);
            if (network == NULL || status != VMNET_SUCCESS) {
              fprintf(stderr, "network creation failed: %d\n", status);
              if (network != NULL) CFRelease(network);
              return 3;
            }

            struct in_addr actual = {0};
            struct in_addr actual_mask = {0};
            vmnet_network_get_ipv4_subnet(network, &actual, &actual_mask);
            print_addr("actual subnet: ", actual);
            print_addr("actual mask: ", actual_mask);

            const unsigned expected = ntohl(requested.s_addr);
            const unsigned mask = ntohl(requested_mask.s_addr);
            const unsigned returned = ntohl(actual.s_addr);
            const unsigned returned_mask = ntohl(actual_mask.s_addr);
            CFRelease(network);

            if (returned_mask != mask || (returned & returned_mask) != expected) {
              fprintf(stderr, "unexpected returned network\n");
              return 4;
            }

            puts("logical network creation passed");
            return 0;
          }
          C

          xcrun clang "$RUNNER_TEMP/probe.c" \
            -framework CoreFoundation \
            -framework vmnet \
            -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
