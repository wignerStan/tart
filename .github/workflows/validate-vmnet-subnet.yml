name: Validate vmnet subnet

on:
  push:
    branches:
      - ci/vmnet-subnet-v2

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift toolchain and development entitlement
        run: |
          swift --version
          swift -e '#if compiler(>=6.4)
          print("Swift 6.4+")
          #else
          fatalError("Swift 6.4 or newer is required")
          #endif'
          plutil -lint Resources/tart-dev.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.vm.networking' Resources/tart-dev.entitlements)" = true
      - name: Build
        run: swift build --build-system swiftbuild
      - name: Run vmnet unit tests
        run: swift test --build-system swiftbuild --filter NetworkVmnetTests
      - name: Smoke test vmnet subnet creation
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/vmnet-smoke.swift" <<'SWIFT'
          import Darwin
          import vmnet

          func ipv4(_ value: String) -> in_addr {
            var address = in_addr()
            guard inet_pton(AF_INET, value, &address) == 1 else {
              fatalError("invalid test address: \(value)")
            }
            return address
          }

          var status: vmnet_return_t = .VMNET_FAILURE
          guard let configuration = vmnet_network_configuration_create(.VMNET_SHARED_MODE, &status),
                status == .VMNET_SUCCESS
          else {
            fatalError("configuration creation failed: \(status)")
          }

          var gateway = ipv4("192.168.247.1")
          var mask = ipv4("255.255.255.0")
          let subnetStatus = vmnet_network_configuration_set_ipv4_subnet(configuration, &gateway, &mask)
          guard subnetStatus == .VMNET_SUCCESS else {
            fatalError("subnet configuration failed: \(subnetStatus)")
          }

          status = .VMNET_FAILURE
          guard let network = vmnet_network_create(configuration, &status), status == .VMNET_SUCCESS else {
            fatalError("network creation failed: \(status)")
          }

          var actualAddress = in_addr()
          var actualMask = in_addr()
          vmnet_network_get_ipv4_subnet(network, &actualAddress, &actualMask)

          let address = UInt32(bigEndian: actualAddress.s_addr)
          let maskValue = UInt32(bigEndian: actualMask.s_addr)
          guard address & maskValue == 0xc0a8_f700, maskValue == 0xffff_ff00 else {
            fatalError("vmnet returned an unexpected subnet")
          }

          print("created vmnet subnet 192.168.247.0/24")
          SWIFT

          swiftc "$RUNNER_TEMP/vmnet-smoke.swift" -framework vmnet -o "$RUNNER_TEMP/vmnet-smoke"

          app="$RUNNER_TEMP/vmnet-smoke.app"
          mkdir -p "$app/Contents/MacOS"
          cp "$RUNNER_TEMP/vmnet-smoke" "$app/Contents/MacOS/tart"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          cp Resources/embedded.provisionprofile "$app/Contents/embedded.provisionprofile"
          codesign --sign - --entitlements Resources/tart-dev.entitlements --force "$app"
          codesign --verify --strict --verbose=2 "$app"
          "$app/Contents/MacOS/tart"
