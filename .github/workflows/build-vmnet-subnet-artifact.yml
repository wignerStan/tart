name: Build vmnet subnet test artifact

on:
  push:
    branches:
      - build/vmnet-subnet-macos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon macOS artifact
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      FEATURE_COMMIT: 6b8776becb146ad01895ba14bfeedfaa656da9a0

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain and verify source
        run: |
          set -euxo pipefail
          sw_vers
          swift --version
          xcodebuild -version
          git merge-base --is-ancestor "$FEATURE_COMMIT" HEAD
          git diff --exit-code "$FEATURE_COMMIT" -- . \
            ':(exclude).github/workflows/build-vmnet-subnet-artifact.yml'

      - name: Build and test vmnet feature
        run: |
          export PATH="$PATH:/usr/sbin"
          swift build --build-system swiftbuild
          swift test --build-system swiftbuild --filter NetworkVmnetTests

      - name: Verify formatting
        run: |
          swift package plugin \
            --allow-writing-to-package-directory \
            swiftformat \
            --cache ignore \
            --lint \
            --report swiftformat.json \
            .

      - name: Build release binary and verify CLI
        env:
          VERSION: 0.0.0-vmnet-subnet-${{ github.sha }}
        run: |
          set -euxo pipefail

          .ci/set-version.sh
          sh .ci/build-release.sh arm64

          binary=".build/prebuilt/arm64/tart"
          file "$binary"
          "$binary" --version
          "$binary" run --help | grep -- "--net-vmnet-subnet"

      - name: Create and sign app bundle
        run: |
          set -euxo pipefail

          package="dist/tart-vmnet-subnet"
          app="$package/tart.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"

          cp .build/prebuilt/arm64/tart "$app/Contents/MacOS/tart"
          cp Resources/embedded.provisionprofile "$app/Contents/"
          cp Resources/Info.plist "$app/Contents/"
          cp "Resources/actool/UPW Tart.icns" "$app/Contents/Resources/"
          cp "Resources/actool/Assets.car" "$app/Contents/Resources/"
          cp Resources/tart-dev.entitlements "$package/"

          cat > "$package/resign-local.sh" <<'EOF'
          #!/bin/sh
          set -eu
          cd "$(dirname "$0")"
          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements tart-dev.entitlements \
            tart.app
          codesign --verify --strict --deep --verbose=2 tart.app
          codesign --display --entitlements :- tart.app
          EOF
          chmod +x "$package/resign-local.sh"

          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements Resources/tart-dev.entitlements \
            "$app"

          codesign --verify --strict --deep --verbose=2 "$app"
          codesign --display --entitlements :- "$app" | tee dist/entitlements.plist
          file "$app/Contents/MacOS/tart"

      - name: Package test build
        run: |
          set -euxo pipefail

          cat > dist/tart-vmnet-subnet/TESTING.md <<'EOF'
          # Tart vmnet-subnet test build

          This Apple Silicon test build is produced from feature commit
          `6b8776becb146ad01895ba14bfeedfaa656da9a0` and requires macOS 26 or newer.
          It is development-signed with Tart's embedded provisioning profile and
          `com.apple.vm.networking` entitlement; it is not notarized.

          ## Install without replacing normal Tart

          ```shell
          unzip tart-vmnet-subnet-arm64.zip
          cd tart-vmnet-subnet
          xattr -dr com.apple.quarantine tart.app
          ./resign-local.sh
          sudo mkdir -p /Applications/Tart-vmnet-subnet
          sudo ditto tart.app /Applications/Tart-vmnet-subnet/tart.app
          sudo ln -sf /Applications/Tart-vmnet-subnet/tart.app/Contents/MacOS/tart /opt/homebrew/bin/tart-vmnet-subnet
          tart-vmnet-subnet --version
          ```

          Re-signing locally is intentional. GitHub-hosted macOS runners terminate
          executables that carry the restricted vmnet entitlement, so Actions can
          compile, inspect, and verify the signature but cannot execute the signed
          application. The unsigned release binary is executed before packaging to
          verify the CLI and option registration.

          ## Test the subnet

          Choose a private CIDR that does not overlap your LAN, VPN, sing-box TUN,
          Parallels networks, or another active vmnet network:

          ```shell
          tart-vmnet-subnet run \
            --net-vmnet-subnet 192.168.200.0/24 \
            YOUR_VM_NAME
          ```

          In another terminal, resolve the address actually assigned by DHCP:

          ```shell
          GUEST_IP="$(tart-vmnet-subnet ip YOUR_VM_NAME --wait 120)"
          printf 'guest IP: %s\n' "$GUEST_IP"
          route -n get "$GUEST_IP"
          ```

          The guest address is not guaranteed to be `.2`. If the default DHCP lease
          resolver does not see the logical-network lease, retry after the guest has
          generated traffic:

          ```shell
          tart-vmnet-subnet ip YOUR_VM_NAME --resolver arp --wait 120
          ```

          `--resolver agent` is another option when tart-guest-agent is installed.

          Configure sing-box to match destination `192.168.200.0/24` and select its
          direct outbound. The packet may still enter the TUN; the deterministic
          CIDR is what distinguishes Tart from Parallels.
          EOF

          {
            printf 'feature commit: %s\n' "$FEATURE_COMMIT"
            printf 'build commit: %s\n' "$GITHUB_SHA"
          } > dist/tart-vmnet-subnet/BUILD_COMMIT.txt

          ditto -c -k --sequesterRsrc --keepParent \
            dist/tart-vmnet-subnet \
            dist/tart-vmnet-subnet-arm64.zip
          shasum -a 256 dist/tart-vmnet-subnet-arm64.zip \
            > dist/tart-vmnet-subnet-arm64.zip.sha256

      - name: Upload test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tart-vmnet-subnet-arm64-${{ github.sha }}
          path: |
            dist/tart-vmnet-subnet-arm64.zip
            dist/tart-vmnet-subnet-arm64.zip.sha256
            dist/entitlements.plist
            swiftformat.json
          if-no-files-found: error
          retention-days: 14
